
#  Configuración de la herramienta ORM · ACADT · RA3 · CE b
#  La lee JPAUtil al crear la unidad de persistencia.


# --- Conexión: copiad URL, usuario y contraseña de vuestro proyecto del RA2.
#     createDatabaseIfNotExist crea la BD "ra3_p1_e1" si no existe.
jakarta.persistence.jdbc.url=jdbc:mysql://localhost:3306/ra3_p1_e1?createDatabaseIfNotExist=true
jakarta.persistence.jdbc.user=root
jakarta.persistence.jdbc.password=

# --- Generación del esquema
#     drop-and-create -> borra y crea las tablas en cada ejecución (desarrollo)
#     create          -> solo crea
#     none            -> no toca el esquema (producción)
#     Equivalente nativo de Hibernate: hibernate.hbm2ddl.auto
jakarta.persistence.schema-generation.database.action=drop-and-create

# --- Mostrar el SQL que genera Hibernate (muy útil para aprender)
hibernate.show_sql=true
hibernate.format_sql=true

# No hace falta indicar el dialecto: Hibernate lo detecta a partir de la conexión.
